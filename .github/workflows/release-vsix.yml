name: Build & Release VSIX

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build, Test & Package VSIX
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Windows Native SendSlash.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize /out:"bin\SendSlash.exe" "tools\SendSlash.cs"
          if (-not (Test-Path "bin\SendSlash.exe")) { throw "SendSlash.exe 编译失败" }

      - name: Run Automated Tests
        run: npm test

      - name: Package Extension (.vsix)
        shell: pwsh
        run: |
          npx --yes @vscode/vsce package --allow-missing-repository
          $vsix = Get-ChildItem -Filter "*.vsix" | Select-Object -First 1
          if (-not $vsix) { throw "未找到打包生成的 .vsix 文件" }
          echo "VSIX_NAME=$($vsix.Name)" >> $env:GITHUB_ENV

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-slash-helper-vsix
          path: '*.vsix'
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
